[alembic]
# Path to migration scripts
script_location = alembic

# sqlalchemy.url is overridden at runtime in alembic/env.py from DATABASE_URL.
# This placeholder satisfies Alembic's ini parser but is never used directly.
sqlalchemy.url = driver://user:pass@localhost/db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
